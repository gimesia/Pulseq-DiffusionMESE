[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulseq-diffusion-mese"
version = "0.1.0"
description = "A Pulseq pulse sequence for diffusion-weighted multi-echo spin echo (MESE) MRI"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["MRI", "pulseq", "diffusion", "MESE", "pulse sequence"]
dependencies = [
    "pypulseq>=1.4.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pulseq_diffusion_mese"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.coverage.run]
source = ["simulation"]
omit = [
    "simulation/qMRI_adc.py",
    "simulation/qMRI_adc_diff_multishot_se.py",
    "simulation/qMRI_adc_triple_se.py",
    "simulation/qMRI_t2relax.py",
    "simulation/qMRI_t2relax_diff_multishot_se.py",
    "simulation/qMRI_t2relax_multishot_se.py",
    "simulation/qMRI_t2relax_triple_se.py",
    "simulation/simulateMESE.py",
    "simulation/simulateSE.py",
    "simulation/qmri_sim_run.py",
    "simulation/qmri_sim_run_volume.py",
    "simulation/qmri_sim_adc_multishot.py",
    "simulation/qmri_sim_adc_sse.py",
    "simulation/qmri_sim_adc_triple.py",
    "simulation/qmri_sim_t2_multishot.py",
    "simulation/qmri_sim_t2_sse.py",
    "simulation/qmri_sim_t2_triple.py",
    "simulation/qmri_sim_lib.py",
    "simulation/phantom_loader.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
