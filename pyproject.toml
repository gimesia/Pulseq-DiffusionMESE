[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulseq-diffusion-mese"
version = "0.1.0"
description = "A Pulseq pulse sequence for diffusion-weighted multi-echo spin echo (MESE) MRI"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["MRI", "pulseq", "diffusion", "MESE", "pulse sequence"]
dependencies = [
    "pypulseq>=1.4.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pulseq_diffusion_mese"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
